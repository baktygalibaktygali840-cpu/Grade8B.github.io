```html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный тест 😎</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 36px;
        }

        #counter {
            opacity: 0.8;
            margin-bottom: 30px;
        }

        #question {
            font-size: 25px;
            margin-bottom: 40px;
        }

        .answers {
            position: relative;
            height: 180px;
        }

        button {
            position: absolute;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: left 0.05s, top 0.05s, transform 0.15s;
        }

        #answer1 {
            background: #ff6b6b;
            color: white;
        }

        #answer2 {
            background: #51cf66;
            color: white;
        }

        button:hover {
            transform: scale(1.08);
        }

        #message {
            font-size: 20px;
            margin-top: 20px;
            min-height: 30px;
        }

        #next {
            display: none;
            position: static;
            margin: 20px auto 0;
            background: white;
            color: #5f3dc4;
        }

        .win {
            display: none;
        }

        .win h2 {
            font-size: 40px;
        }

        .restart {
            position: static;
            background: white;
            color: #5f3dc4;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div id="game">

        <h1>8Б класска</h1>

        <div id="counter"></div>

        <div id="question"></div>

        <div class="answers">
            <button id="answer1"></button>
            <button id="answer2"></button>
        </div>

        <div id="message"></div>

        <button id="next">Следующий вопрос →</button>

    </div>

    <div class="win" id="win">

        <h2>🎉 ПОБЕДА!</h2>

        <p>Ты прошёл весь тест!</p>

        <p> </p>

        <button class="restart" onclick="location.reload()">
            🔄 Пройти ещё раз
        </button>

    </div>

</div>


<script>

const questions = [

    {
        question: "В нашей школе было мероприятие, мы получили 1 место?",
        answers: [
            { text: "Да", correct: false },
            { text: "Нет", correct: true }
        ]
    },

    {
        question: "Тогда какое место мы получили?",
        answers: [
            { text: "1 место", correct: false },
            { text: "2 место", correct: true }
        ]
    },

    {
        question: "Кто сделал этот сайт?",
        answers: [
            { text: "Алпамыс", correct: false },
            { text: "Ясин", correct: true }
        ]
    }

];


let currentQuestion = 0;


// Получаем элементы
const question = document.getElementById("question");
const answer1 = document.getElementById("answer1");
const answer2 = document.getElementById("answer2");
const message = document.getElementById("message");
const next = document.getElementById("next");
const counter = document.getElementById("counter");
const game = document.getElementById("game");
const win = document.getElementById("win");


// Здесь запоминаем, какая кнопка неправильная
let wrongButton;


// 🔀 Перемешивание массива
function shuffle(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}


// Загружаем вопрос
function loadQuestion() {

    const q = questions[currentQuestion];

    question.textContent = q.question;

    counter.textContent =
        `Вопрос ${currentQuestion + 1} из ${questions.length}`;

    message.textContent = "";

    next.style.display = "none";


    // 🔀 Перемешиваем ответы
    const answers = shuffle([...q.answers]);


    answer1.textContent = answers[0].text;
    answer2.textContent = answers[1].text;


    // Определяем неправильную кнопку
    if (answers[0].correct) {
        answer1.dataset.correct = "true";
        answer2.dataset.correct = "false";
    } else {
        answer1.dataset.correct = "false";
        answer2.dataset.correct = "true";
    }


    // Возвращаем кнопки
    answer1.style.left = "15%";
    answer1.style.top = "0px";

    answer2.style.left = "auto";
    answer2.style.right = "15%";
    answer2.style.top = "0px";


    answer1.style.pointerEvents = "auto";
    answer2.style.pointerEvents = "auto";


    // Определяем неправильную кнопку
    wrongButton =
        answer1.dataset.correct === "false"
        ? answer1
        : answer2;
}


// 🏃‍♂️ СУПЕР-БЫСТРОЕ УБЕГАНИЕ
function runAway(button) {

    const container = document.querySelector(".answers");

    const maxX = container.clientWidth - button.offsetWidth;
    const maxY = container.clientHeight - button.offsetHeight;


    // Очень быстро выбираем новое место
    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;


    button.style.left = randomX + "px";
    button.style.top = randomY + "px";


    // Дополнительное изменение текста
    const currentText = button.textContent;

    if (currentText === "Да") {
        button.textContent = "Нет";
    }
    else if (currentText === "Нет") {
        button.textContent = "Да";
    }
}


// 🏃 Реагируем ещё до наведения
answer1.addEventListener("mouseenter", function() {

    if (answer1 === wrongButton) {
        runAway(answer1);
    }

});


answer2.addEventListener("mouseenter", function() {

    if (answer2 === wrongButton) {
        runAway(answer2);
    }

});


// 🏃‍♂️ Дополнительная защита:
// если мышь приближается к неправильной кнопке,
// она снова убегает
document.addEventListener("mousemove", function(event) {

    if (!wrongButton) return;

    const rect = wrongButton.getBoundingClientRect();

    const distanceX =
        event.clientX - (rect.left + rect.width / 2);

    const distanceY =
        event.clientY - (rect.top + rect.height / 2);

    const distance =
        Math.sqrt(distanceX * distanceX + distanceY * distanceY);


    // Если курсор близко — убегаем
    if (distance < 90) {

        runAway(wrongButton);

    }

});


// Проверка ответа
function checkAnswer(button) {

    const correct =
        button.dataset.correct === "true";


    if (correct) {

        message.textContent = "✅ Правильно!";

        answer1.style.pointerEvents = "none";
        answer2.style.pointerEvents = "none";

        next.style.display = "block";

    } else {

        message.textContent =
            "😂 ХА! Этот ответ неправильный!";

        runAway(button);
    }
}


answer1.addEventListener("click", function() {
    checkAnswer(answer1);
});


answer2.addEventListener("click", function() {
    checkAnswer(answer2);
});


// Следующий вопрос
next.addEventListener("click", function() {

    currentQuestion++;


    if (currentQuestion >= questions.length) {

        game.style.display = "none";
        win.style.display = "block";

    } else {

        loadQuestion();

    }

});


// Запускаем первый вопрос
loadQuestion();

</script>

</body>
</html>
